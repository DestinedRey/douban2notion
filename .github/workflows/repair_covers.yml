name: repair Notion covers

on:
  workflow_dispatch:
    inputs:
      limit:
        description: 'Maximum pages per library; 1 for canary, 0 for all'
        required: true
        default: '1'

permissions:
  contents: read
concurrency:
  group: douban-sync-${{ github.ref }}
  cancel-in-progress: false
  queue: max

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        kind: [movie, book]
    env:
      NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
      MOVIE_NOTION_TOKEN: ${{ secrets.MOVIE_NOTION_TOKEN }}
      BOOK_NOTION_TOKEN: ${{ secrets.BOOK_NOTION_TOKEN }}
      NOTION_MOVIE_URL: ${{ secrets.NOTION_MOVIE_URL }}
      NOTION_BOOK_URL: ${{ secrets.NOTION_BOOK_URL }}
      REPAIR_LIMIT: ${{ inputs.limit }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt cryptography==50.0.2
      - name: Test
        run: python -m unittest discover -s tests -v
      - name: Diagnose remaining image sources (read only)
        run: |
          python -u - <<'PY'
          import sys, json, requests, re
          sys.path.insert(0, 'scripts')
          from notion_helper import NotionHelper
          from covers import external_douban_url, IMAGE_HEADERS
          from douban import headers, DOUBAN_API_HOST, DOUBAN_API_KEY
          kind = '${{ matrix.kind }}'
          helper = NotionHelper(kind)
          rows = helper.query_all(getattr(helper, kind + '_database_id'))
          rows.sort(key=lambda p:p.get('created_time',''), reverse=True)
          count = 0
          for page in rows:
              files = page.get('properties', {}).get('封面', {}).get('files', [])
              urls = [external_douban_url(f) for f in files]
              urls = [u for u in urls if u]
              if not urls: continue
              subject = page.get('properties', {}).get('豆瓣链接', {}).get('url', '')
              result = {'page_id': page['id'], 'kind': kind, 'source': urls[0]}
              try:
                  r = requests.get(urls[0], headers=IMAGE_HEADERS, timeout=(10,30))
                  result.update(status=r.status_code, mime=r.headers.get('Content-Type'), signature=r.content[:16].hex())
                  if r.status_code != 200 or not r.content.startswith(b'\xff\xd8'):
                      sid = re.search(r'/subject/(\d+)', subject).group(1)
                      r = requests.get(f'https://{DOUBAN_API_HOST}/api/v2/{kind}/{sid}',headers=headers,params={'apiKey':DOUBAN_API_KEY},timeout=(10,30))
                      result['metadata_status'] = r.status_code
                      if r.ok:
                          pic=r.json().get('pic', {})
                          result['current_pic']=pic
                          u=pic.get('large')
                          if u:
                              rr=requests.get(u,headers=IMAGE_HEADERS,timeout=(10,30))
                              result['current_status']=rr.status_code
                              result['current_signature']=rr.content[:16].hex()
              except Exception as exc: result['error']=type(exc).__name__
              print(json.dumps(result),flush=True)
              count+=1
              if count>=6: break
          PY
